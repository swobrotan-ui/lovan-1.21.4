plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'io.freefair.lombok' version '8.6'
	id("org.jetbrains.kotlin.jvm") version "2.1.20"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	include(modImplementation('io.netty:netty-handler-proxy:4.1.82.Final'))
	include(modImplementation('io.netty:netty-codec-socks:4.1.82.Final'))
	include(modImplementation('dev.redstones.mediaplayerinfo:media-player-info:0.1.0'))
	include(modImplementation('org.jetbrains.kotlin:kotlin-stdlib:1.9.20'))
	include(modImplementation('org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.6.3'))
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation "net.fabricmc:intermediary:1.21.4"

	compileOnly 'org.projectlombok:lombok:1.18.32'
	annotationProcessor 'org.projectlombok:lombok:1.18.32'

	implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"
	compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.0.0'

	implementation fileTree(dir: 'libs', include: ['*.jar'])
	
	// Fix for javax.annotation.Nonnull
	compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}

loom {
	mixin {
  defaultRefmapName = "sodiumextra-refmap.json"
		useLegacyMixinAp = true
	}

	runs {
		client {
			vmArgs "-Dfabric.legacyClassPath=true"
			property "fabric.development", "true"
		}
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

sourceSets {
	main {
		java {
			exclude 'ru/levin/util/viaversion/**'
			exclude 'ru/levin/util/SwapHelpers.java'
			exclude 'ru/levin/modules/combat/Hitbox.java'
			exclude 'ru/levin/modules/combat/HitBox.java'
		}
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	manifest {
		attributes(
			"Mod-Version": project.version,
			"Mod-Id": "lovmod",
			"Protection-Level": "native",
			"Build-Timestamp": new Date().format('yyyy-MM-dd HH:mm:ss')
		)
	}
}

task generateProtectedJar(type: Jar) {
	group = 'build'
	description = 'Generate protected JAR with embedded integrity checksum'
	
	from jar
	archiveBaseName = "${archiveBaseName}-protected"
	archiveVersion = archiveVersion
	
	doFirst {
		def jarFile = file("${buildDir}/libs/${archiveBaseName}.jar")
		if (jarFile.exists()) {
			def digest = java.security.MessageDigest.getInstance("SHA-256")
			def bytes = jarFile.bytes
			def hash = digest.digest(bytes).encodeHex().toString()
			
			manifest {
				attributes(
					"Mod-Version": project.version,
					"Mod-Id": "lovmod",
					"Protection-Level": "native",
					"Integrity-Hash": hash,
					"Build-Timestamp": new Date().format('yyyy-MM-dd HH:mm:ss'),
					"Protected-By": "Lovan Security"
				)
			}
		}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}

configurations.configureEach {
	resolutionStrategy {
		force "net.fabricmc:sponge-mixin:0.15.5+mixin.0.8.7"
	}
}